include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/config/firebase/firebase_options_*.dart"
  errors:
    invalid_annotation_target: ignore

    # TODO(analysis): For the first phase of Very Good Analysis we only enforce errors and warnings.
    # The following existing info/hint rules are temporarily hidden to avoid overwhelming
    # development with technical debt. Later, the ignores should be removed in batches
    # according to their risk, re-enabled, and fixed.
    #
    # Re-enable as a priority:
    # - discarded_futures
    # - unawaited_futures
    # - only_throw_errors
    #
    # Handle later:
    # - avoid_catches_without_on_clauses
    # - cascade_invocations
    # - avoid_slow_async_io
    # - sort_pub_dependencies

    discarded_futures: ignore
    unawaited_futures: ignore
    only_throw_errors: ignore
    avoid_catches_without_on_clauses: ignore
    cascade_invocations: ignore
    avoid_slow_async_io: ignore
    sort_pub_dependencies: ignore
    matching_super_parameters: ignore
    prefer_asserts_with_message: ignore
    one_member_abstracts: ignore
    join_return_with_assignment: ignore
    avoid_positional_boolean_parameters: ignore
    flutter_style_todos: ignore

linter:
  rules:
    # This app is not a package; in the first phase we do not require dartdoc
    # to avoid hundreds of warnings flooding the developer workflow.
    public_member_api_docs: false
    always_use_package_imports: true

    # After resolving high-priority warnings, async and type issues,
    # gradually clean up existing long lines and re-enable this rule.
    lines_longer_than_80_chars: false