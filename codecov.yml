coverage:
  precision: 2
  round: down
  range: "40...80"

  status:
    project:
      default:
        target: 60%          # Start with a conservative value, adjust after seeing the actual numbers.
        threshold: 5%
        if_ci_failed: error
    patch:
      default:
        target: 50%          # Coverage threshold for new/modified code
        threshold: 10%
        if_ci_failed: error

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "**/*.g.dart"              # build_runner / drift / json_serializable generates files
  - "**/*.freezed.dart"        # Freezed file
  - "lib/config/firebase/**"   # Firebase config dynamically generated by CI
  - "test/**"